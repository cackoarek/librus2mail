name: Docker - Build & Test Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

jobs:
  build-and-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build test image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: librus2mail:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI entrypoints in container
        run: |
          docker run --rm librus2mail:test librus-collector --help
          docker run --rm librus2mail:test librus-report --help
          docker run --rm librus2mail:test python -c "import librus2mail; print(f'Librus2mail version: {librus2mail.__version__}')"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
