name: Docker - Build & Publish Image

on:
  push:
    # Automatyczny build po każdym push do main (obraz :latest + :sha-*)
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
    # Build wyzwalany przez release tag (obraz :1.2.0 + :latest)
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

jobs:
  build-and-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag :latest dla brancha main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag numeryczny z tagu Git (np. 1.2.0)
            type=semver,pattern={{version}}
            # Tag major.minor (np. 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag sha- dla każdego commita
            type=sha,prefix=sha-

      - name: Build and test image locally (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: librus2mail:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI entrypoints in container
        run: |
          docker run --rm librus2mail:test librus-collector --help
          docker run --rm librus2mail:test librus-report --help
          docker run --rm librus2mail:test python -c "import librus2mail; print(f'Librus2mail version: {librus2mail.__version__}')"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add Step Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🐳 Docker Image opublikowany" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tagi:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
