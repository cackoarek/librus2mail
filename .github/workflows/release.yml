name: Release – Tag & Publish

# Wyzwalany wyłącznie przez tagi w formacie v* (np. v1.2.0, v2.0.0-rc1)
# Użycie: git tag v1.2.0 -m "Opis wersji" && git push origin v1.2.0
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # rc, beta, alpha

permissions:
  contents: write  # wymagane do tworzenia GitHub Release i commitowania wersji

jobs:
  # ------------------------------------------------------------------
  # 1. Wyodrębnienie wersji i walidacja tagu
  # ------------------------------------------------------------------
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}

    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"   # usuń prefiks 'v'
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Sprawdź czy to pre-release (zawiera myślnik: rc1, beta, alpha)
          if [[ "${VERSION}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "🏷️ Tag: ${TAG} | Wersja: ${VERSION}"

  # ------------------------------------------------------------------
  # 2. Testy – weryfikacja przed wydaniem
  # ------------------------------------------------------------------
  test:
    name: Tests (pre-release gate)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run linter (Ruff)
        run: ruff check .

      - name: Run tests
        run: pytest --cov=librus2mail --cov-report=term

  # ------------------------------------------------------------------
  # 3. Aktualizacja wersji w plikach projektu
  # ------------------------------------------------------------------
  bump-version:
    name: Bump Version in Source
    runs-on: ubuntu-latest
    needs: [prepare, test]
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Użyj dedykowanego tokenu aby commit mógł triggerować inne workflows
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          fetch-depth: 0  # wymagane do odczytania tagów i historii commitów dla changeloga

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "✅ pyproject.toml → version = \"${VERSION}\""

      - name: Update __version__ in __init__.py
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          INIT_FILE="src/librus2mail/__init__.py"
          if [ -f "$INIT_FILE" ]; then
            sed -i "s/__version__ = \".*\"/__version__ = \"${VERSION}\"/" "$INIT_FILE"
            echo "✅ __init__.py → __version__ = \"${VERSION}\""
          fi

      - name: Update CHANGELOG.md
        run: |
          python .github/scripts/update_changelog.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}"

      - name: Commit version bump and changelog
        id: commit
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sprawdź czy są zmiany do zacommitowania
          if git diff --quiet; then
            echo "ℹ️ Wersja i changelog już były aktualne – brak zmian do zacommitowania."
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git add pyproject.toml src/librus2mail/__init__.py CHANGELOG.md
            git commit -m "chore(release): bump version to ${VERSION} and update CHANGELOG [skip ci]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "✅ Zacommitowano aktualizację wersji ${VERSION} oraz CHANGELOG.md do main"
          fi

  # ------------------------------------------------------------------
  # 4. Tworzenie GitHub Release z automatycznym CHANGELOG
  # ------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, bump-version]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # wymagane dla poprawnego generowania changelog

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          # Znajdź poprzedni tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)

          echo "Poprzedni tag: ${PREV_TAG:-'(brak – pierwsze wydanie)'}"

          # Przygotuj nagłówek release notes
          cat > /tmp/release_notes.md << EOF
          ## 🚀 Librus2mail ${VERSION}

          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "### 📝 Zmiany od ${PREV_TAG}" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md

            # Zbierz commity z podziałem na kategorie
            FEATURES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- feat" || true)
            FIXES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- fix" || true)
            DOCS=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- docs" || true)
            CHORES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- chore|^- ci|^- build|^- refactor|^- test|^- perf" || true)

            if [ -n "$FEATURES" ]; then
              echo "#### ✨ Nowe funkcje" >> /tmp/release_notes.md
              echo "$FEATURES" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            if [ -n "$FIXES" ]; then
              echo "#### 🐛 Poprawki błędów" >> /tmp/release_notes.md
              echo "$FIXES" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            if [ -n "$DOCS" ]; then
              echo "#### 📚 Dokumentacja" >> /tmp/release_notes.md
              echo "$DOCS" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            if [ -n "$CHORES" ]; then
              echo "#### 🔧 Inne zmiany" >> /tmp/release_notes.md
              echo "$CHORES" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            # Jeśli żadna kategoria nie pasuje, wstaw surową listę
            ALL_CATEGORIZED="${FEATURES}${FIXES}${DOCS}${CHORES}"
            if [ -z "$ALL_CATEGORIZED" ]; then
              git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi
          else
            echo "_Pierwsze oficjalne wydanie_ 🎉" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi

          # Stopka z informacjami o Docker image
          cat >> /tmp/release_notes.md << EOF

          ---
          ### 🐳 Docker

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${VERSION}
          docker pull ghcr.io/${{ github.repository }}:latest
          \`\`\`
          EOF

          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Add Pages links to Release Notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO_NAME}"

          cat >> /tmp/release_notes.md << EOF

          ---
          ### 📄 Przykładowe raporty (GitHub Pages)

          | Raport | Link |
          |:---|:---|
          | 📬 Powiadomienie e-mail | [${PAGES_BASE}/v${VERSION}/powiadomienie_collector.html](${PAGES_BASE}/v${VERSION}/powiadomienie_collector.html) |
          | 📊 Raport postępów ucznia (dla rodziców) | [${PAGES_BASE}/v${VERSION}/raport_8979296.html](${PAGES_BASE}/v${VERSION}/raport_8979296.html) |
          | 🎮 Raport ucznia: Kids (klasy 4–6) | [${PAGES_BASE}/v${VERSION}/raport_kids.html](${PAGES_BASE}/v${VERSION}/raport_kids.html) |
          | 🚀 Raport ucznia: Teens (klasy 7–8) | [${PAGES_BASE}/v${VERSION}/raport_teens.html](${PAGES_BASE}/v${VERSION}/raport_teens.html) |
          | 🎯 Raport ucznia: Youth (szkoła średnia) | [${PAGES_BASE}/v${VERSION}/raport_youth.html](${PAGES_BASE}/v${VERSION}/raport_youth.html) |
          | 🔗 Najnowsza wersja (latest) | [${PAGES_BASE}/latest/](${PAGES_BASE}/latest/) |
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "v${{ needs.prepare.outputs.version }}"
          body_path: ${{ steps.notes.outputs.notes_file }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: ${{ needs.prepare.outputs.is_prerelease == 'false' }}
          generate_release_notes: false

  # ------------------------------------------------------------------
  # 5. Publikacja przykładowych raportów HTML na GitHub Pages
  # ------------------------------------------------------------------
  deploy-pages:
    name: Deploy Example Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [prepare, github-release]
    # Pre-release'y też publikujemy (pod własnym katalogiem), ale nie nadpisują latest
    if: always() && needs.github-release.result == 'success'

    steps:
      - name: Checkout main (source code + examples/storage)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate example HTML reports
        working-directory: source
        run: |
          mkdir -p examples/reports

          # Przygotuj bazową konfigurację na podstawie szablonu
          cp config-example.yaml config.yaml

          # Data referencyjna: ostatni piątek lub 2026-09-18 jako fallback
          # Używamy daty wbudowanej w examples/storage aby raporty były spójne
          ACTUAL_DATE="2026-09-18"

          echo "📬 Generuję powiadomienie e-mail..."
          python librus_updates_notifier.py \
            -c config.yaml \
            -s examples/storage \
            --days 7 \
            --actual-date "${ACTUAL_DATE}" \
            -o examples/reports/powiadomienie_collector.html

          echo "📊 Generuję raport postępów..."
          python librus_progress_report.py \
            -c config.yaml \
            -s examples/storage \
            --days 7 \
            --actual-date "${ACTUAL_DATE}" \
            -o examples/reports/raport_8979296.html \
            --force

          echo "🎮 Generuję raport motywacyjny dla ucznia (kids)..."
          python librus_student_report.py \
            -c config.yaml \
            -u 8979296 \
            -s examples/storage \
            --days 7 \
            --actual-date "${ACTUAL_DATE}" \
            -t kids \
            -o examples/reports/raport_kids.html

          echo "🚀 Generuję raport motywacyjny dla ucznia (teens)..."
          python librus_student_report.py \
            -c config.yaml \
            -u 8979296 \
            -s examples/storage \
            --days 7 \
            --actual-date "${ACTUAL_DATE}" \
            -t teens \
            -o examples/reports/raport_teens.html

          echo "🎯 Generuję raport motywacyjny dla ucznia (youth)..."
          python librus_student_report.py \
            -c config.yaml \
            -u 8979296 \
            -s examples/storage \
            --days 7 \
            --actual-date "${ACTUAL_DATE}" \
            -t youth \
            -o examples/reports/raport_youth.html

          echo "✅ Raporty wygenerowane:"
          ls -la examples/reports/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          # Jeśli gałąź gh-pages nie istnieje – zostanie stworzona
          fetch-depth: 0
        continue-on-error: true

      - name: Initialize gh-pages if it doesn't exist
        run: |
          if [ ! -d "pages" ] || [ -z "$(ls -A pages 2>/dev/null)" ]; then
            echo "ℹ️ Inicjalizuję nową gałąź gh-pages..."
            mkdir -p pages
            cd pages
            git init
            git checkout --orphan gh-pages
          fi

      - name: Copy reports to versioned directory
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"

          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO_NAME}"

          # Katalog wersji (np. pages/v1.2.0/)
          mkdir -p "pages/${TAG}"
          cp source/examples/reports/powiadomienie_collector.html "pages/${TAG}/"
          cp source/examples/reports/raport_8979296.html "pages/${TAG}/"
          cp source/examples/reports/raport_kids.html "pages/${TAG}/"
          cp source/examples/reports/raport_teens.html "pages/${TAG}/"
          cp source/examples/reports/raport_youth.html "pages/${TAG}/"

          # Wygeneruj index.html dla tej wersji
          cat > "pages/${TAG}/index.html" << HTML
          <!DOCTYPE html>
          <html lang="pl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Librus2mail ${TAG} – Przykładowe raporty</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                     max-width: 680px; margin: 60px auto; padding: 0 20px; color: #24292f; }
              h1 { font-size: 1.6rem; }
              .badge { display: inline-block; padding: 3px 10px; border-radius: 12px;
                       font-size: 0.8rem; font-weight: 600; background: #ddf4ff; color: #0969da; }
              .section-title { font-size: 0.95rem; font-weight: 700; color: #57606a; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
              .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 18px 20px;
                      margin: 12px 0; text-decoration: none; display: block; color: inherit; }
              .card:hover { border-color: #0969da; background: #f6f8fa; }
              .card h3 { margin: 0 0 6px; font-size: 1rem; }
              .card p { margin: 0; font-size: 0.875rem; color: #57606a; }
              footer { margin-top: 40px; font-size: 0.8rem; color: #8c959f; }
              a { color: #0969da; }
            </style>
          </head>
          <body>
            <h1>📬 Librus2mail <span class="badge">${TAG}</span></h1>
            <p>Przykładowe raporty wygenerowane automatycznie przy wydaniu wersji <strong>${VERSION}</strong>.</p>

            <div class="section-title">Raporty dla rodziców & powiadomienia</div>

            <a class="card" href="powiadomienie_collector.html">
              <h3>📬 Powiadomienie e-mail</h3>
              <p>Zbiorczy e-mail z nowymi wiadomościami, ogłoszeniami i ocenami ucznia.</p>
            </a>

            <a class="card" href="raport_8979296.html">
              <h3>📊 Raport postępów ucznia</h3>
              <p>Analityczny raport ze średnimi ważonymi, trendami i symulatorem czerwonego paska.</p>
            </a>

            <div class="section-title">Motywacyjne raporty dla ucznia</div>

            <a class="card" href="raport_kids.html">
              <h3>🎮 Raport ucznia – Kids (klasy 4–6)</h3>
              <p>Grywalizacja, odznaki, Supermoce, strefa treningu i język wspierający młodsze dzieci.</p>
            </a>

            <a class="card" href="raport_teens.html">
              <h3>🚀 Raport ucznia – Teens (klasy 7–8)</h3>
              <p>Egzamin 8-klasisty, bilans energii, Quick Wins i konkretne wskazówki awansu oceny.</p>
            </a>

            <a class="card" href="raport_youth.html">
              <h3>🎯 Raport ucznia – Youth (szkoła średnia)</h3>
              <p>Dojrzały dashboard strategiczny, KPI, średnie semestralne i priorytety celów akademickich.</p>
            </a>

            <footer>
              <a href="${PAGES_BASE}/">← Wszystkie wersje</a> &nbsp;|&nbsp;
              <a href="${PAGES_BASE}/latest/">Najnowsza wersja (latest)</a> &nbsp;|&nbsp;
              <a href="https://github.com/${REPO}">GitHub</a>
            </footer>
          </body>
          </html>
          HTML

          # Nadpisz latest/ tylko jeśli to nie jest pre-release
          if [ "${IS_PRERELEASE}" = "false" ]; then
            echo "📌 Aktualizuję latest/ → ${TAG}"
            rm -rf pages/latest
            mkdir -p pages/latest
            cp source/examples/reports/powiadomienie_collector.html pages/latest/
            cp source/examples/reports/raport_8979296.html pages/latest/
            cp source/examples/reports/raport_kids.html pages/latest/
            cp source/examples/reports/raport_teens.html pages/latest/
            cp source/examples/reports/raport_youth.html pages/latest/

            # index.html dla latest (przekierowanie do bieżącej wersji + bezpośrednie linki)
            sed "s|${TAG}|latest|g; s|Librus2mail latest|Librus2mail latest (${TAG})|" \
              "pages/${TAG}/index.html" > pages/latest/index.html
          else
            echo "ℹ️ Pre-release ${TAG} – pomijam aktualizację latest/"
          fi

      - name: Regenerate root index.html (lista wszystkich wersji)
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO_NAME}"

          # Zbierz wszystkie katalogi wersji (posortowane malejąco)
          VERSIONS=$(ls -d pages/v*/ 2>/dev/null | sed 's|pages/||; s|/||' | sort -rV)

          ROWS=""
          for V in $VERSIONS; do
            KIDS_LINK="—"
            TEENS_LINK="—"
            YOUTH_LINK="—"
            if [ -f "pages/${V}/raport_kids.html" ]; then
              KIDS_LINK="<a href=\"${V}/raport_kids.html\">Kids</a>"
            fi
            if [ -f "pages/${V}/raport_teens.html" ]; then
              TEENS_LINK="<a href=\"${V}/raport_teens.html\">Teens</a>"
            fi
            if [ -f "pages/${V}/raport_youth.html" ]; then
              YOUTH_LINK="<a href=\"${V}/raport_youth.html\">Youth</a>"
            fi
            STUDENT_LINKS="${KIDS_LINK} &nbsp;|&nbsp; ${TEENS_LINK} &nbsp;|&nbsp; ${YOUTH_LINK}"
            ROWS="${ROWS}<tr><td><a href=\"${V}/\"><strong>${V}</strong></a></td><td><a href=\"${V}/powiadomienie_collector.html\">📬 Powiadomienie</a></td><td><a href=\"${V}/raport_8979296.html\">📊 Raport postępów</a></td><td>${STUDENT_LINKS}</td></tr>\n"
          done

          cat > pages/index.html << HTML
          <!DOCTYPE html>
          <html lang="pl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Librus2mail – Przykładowe raporty</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                     max-width: 820px; margin: 60px auto; padding: 0 20px; color: #24292f; }
              h1 { font-size: 1.8rem; }
              p.lead { font-size: 1rem; color: #57606a; }
              .latest-box { border: 2px solid #0969da; border-radius: 8px; padding: 20px;
                            margin: 24px 0; background: #ddf4ff; }
              .latest-box h2 { margin: 0 0 8px; font-size: 1.1rem; color: #0969da; }
              .latest-box a { display: inline-block; margin-right: 12px; font-weight: 600;
                              color: #0969da; text-decoration: none; }
              .latest-box a:hover { text-decoration: underline; }
              table { width: 100%; border-collapse: collapse; margin-top: 24px; }
              th { text-align: left; padding: 8px 12px; background: #f6f8fa;
                   border-bottom: 2px solid #d0d7de; font-size: 0.875rem; }
              td { padding: 10px 12px; border-bottom: 1px solid #d0d7de; font-size: 0.875rem; }
              td a { color: #0969da; text-decoration: none; }
              td a:hover { text-decoration: underline; }
              footer { margin-top: 40px; font-size: 0.8rem; color: #8c959f; }
            </style>
          </head>
          <body>
            <h1>📬 Librus2mail – Przykładowe raporty</h1>
            <p class="lead">Automatycznie generowane przykłady wyników działania projektu przy każdym wydaniu.</p>

            <div class="latest-box">
              <h2>🔗 Najnowsza wersja (latest)</h2>
              <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px;">
                <a href="latest/powiadomienie_collector.html">📬 Powiadomienie e-mail</a>
                <a href="latest/raport_8979296.html">📊 Raport postępów</a>
                <a href="latest/raport_kids.html">🎮 Kids (kl. 4–6)</a>
                <a href="latest/raport_teens.html">🚀 Teens (kl. 7–8)</a>
                <a href="latest/raport_youth.html">🎯 Youth (liceum)</a>
                <a href="latest/">📁 Strona wersji</a>
              </div>
            </div>

            <table>
              <thead>
                <tr>
                  <th>Wersja</th>
                  <th>Powiadomienie e-mail</th>
                  <th>Raport postępów (rodzic)</th>
                  <th>Raporty ucznia (Kids / Teens / Youth)</th>
                </tr>
              </thead>
              <tbody>
                $(echo -e "$ROWS")
              </tbody>
            </table>

            <footer>
              <a href="https://github.com/${REPO}">GitHub: ${REPO}</a>
            </footer>
          </body>
          </html>
          HTML

          echo "✅ Root index.html wygenerowany z $(echo "$VERSIONS" | wc -w) wersjami."

          # Wyłącz silnik Jekyll, aby GitHub Pages serwował czyste pliki HTML 1:1
          touch pages/.nojekyll
          echo "✅ Utworzono plik .nojekyll"

      - name: Commit and push to gh-pages
        working-directory: pages
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ustaw remote jeśli inicjalizowaliśmy od zera
          if ! git remote | grep -q origin; then
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

          git add -A

          if git diff --staged --quiet; then
            echo "ℹ️ Brak zmian do opublikowania na gh-pages."
          else
            git commit -m "docs(pages): deploy example reports for ${TAG} [skip ci]"
            git push origin HEAD:gh-pages --force
            echo "✅ Opublikowano raporty na gh-pages dla ${TAG}"
          fi

          # Podsumowanie w GitHub Actions Summary
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO_NAME}"

          echo "### 📄 GitHub Pages – Przykładowe raporty" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Raport | Link |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📬 Powiadomienie e-mail | [${PAGES_BASE}/${TAG}/powiadomienie_collector.html](${PAGES_BASE}/${TAG}/powiadomienie_collector.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Raport postępów (rodzic) | [${PAGES_BASE}/${TAG}/raport_8979296.html](${PAGES_BASE}/${TAG}/raport_8979296.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎮 Raport ucznia: Kids (kl. 4–6) | [${PAGES_BASE}/${TAG}/raport_kids.html](${PAGES_BASE}/${TAG}/raport_kids.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Raport ucznia: Teens (kl. 7–8) | [${PAGES_BASE}/${TAG}/raport_teens.html](${PAGES_BASE}/${TAG}/raport_teens.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Raport ucznia: Youth (szkoła średnia) | [${PAGES_BASE}/${TAG}/raport_youth.html](${PAGES_BASE}/${TAG}/raport_youth.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Najnowsza wersja | [${PAGES_BASE}/latest/](${PAGES_BASE}/latest/) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 Wszystkie wersje | [${PAGES_BASE}/](${PAGES_BASE}/) |" >> $GITHUB_STEP_SUMMARY
