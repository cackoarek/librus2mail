<!-- ========================================================================= -->
<!-- WSPÓLNY MODAL EDYCJI OCENY I WAGI (DLA WIDOKU OCEN ORAZ ANALIZY PRZEDMIOTU) -->
<!-- ========================================================================= -->
<div id="edit-grade-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 hidden" onclick="handleEditModalBackdropClick(event)">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 transform transition-all relative" onclick="event.stopPropagation()">
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
                <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
                    <span>✏️</span>
                    <span>Edytuj ocenę lub wagę</span>
                </h3>
                <p id="modal-grade-subject" class="text-xs text-indigo-600 font-semibold mt-0.5">Przedmiot</p>
            </div>
            <button type="button" onclick="closeEditGradeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer text-lg leading-none" title="Zamknij">
                ✕
            </button>
        </div>

        <!-- Metadane ze szkoły -->
        <div class="my-4 p-3 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1 text-xs text-slate-600">
            <div class="flex justify-between">
                <span class="text-slate-400">Kategoria:</span>
                <span id="modal-grade-category" class="font-bold text-slate-700 text-right">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-400">Data / Nauczyciel:</span>
                <span id="modal-grade-teacher-date" class="font-medium text-slate-600 text-right">-</span>
            </div>
        </div>

        <!-- Alert jeśli ocena była już modyfikowana -->
        <div id="modal-grade-custom-alert" class="hidden mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
            <div class="font-bold flex items-center gap-1.5">
                <span>⚠️</span>
                <span>Ocena skorygowana ręcznie</span>
            </div>
            <div id="modal-grade-original-info" class="mt-1 text-amber-700">
                Wartości z Librusa: ocena <strong>-</strong>, waga: <strong>-</strong>.
            </div>
        </div>

        <!-- Formularz edycji -->
        <form id="edit-grade-form" onsubmit="submitEditGrade(event)" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" id="modal-grade-id" name="grade_id" value="">

            <div>
                <label for="modal-input-grade" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Wartość oceny
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <select id="modal-input-grade" name="grade" class="px-3 py-2 text-sm font-bold text-slate-800 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option value="6">6 (celujący)</option>
                        <option value="6-">6-</option>
                        <option value="5+">5+</option>
                        <option value="5">5 (bardzo dobry)</option>
                        <option value="5-">5-</option>
                        <option value="4+">4+</option>
                        <option value="4">4 (dobry)</option>
                        <option value="4-">4-</option>
                        <option value="3+">3+</option>
                        <option value="3">3 (dostateczny)</option>
                        <option value="3-">3-</option>
                        <option value="2+">2+</option>
                        <option value="2">2 (dopuszczający)</option>
                        <option value="2-">2-</option>
                        <option value="1+">1+</option>
                        <option value="1">1 (niedostateczny)</option>
                        <option value="np">np</option>
                        <option value="+">+</option>
                        <option value="-">-</option>
                    </select>
                    <input type="text" id="modal-input-grade-custom" placeholder="Wpisz inną..." class="px-3 py-2 text-sm text-slate-800 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" title="Wpisz niestandardową ocenę jeśli brak na liście">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="modal-input-weight" class="text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Waga oceny
                    </label>
                    <span class="text-[11px] text-slate-400">Szybki wybór:</span>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" id="modal-input-weight" name="weight" min="0" max="20" step="0.5" required
                           class="w-24 px-3 py-2 text-sm font-bold text-slate-800 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    
                    <!-- Szybkie przyciski wag -->
                    <div class="flex gap-1">
                        <button type="button" onclick="setModalWeight(1)" class="px-2.5 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg cursor-pointer">1</button>
                        <button type="button" onclick="setModalWeight(2)" class="px-2.5 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg cursor-pointer">2</button>
                        <button type="button" onclick="setModalWeight(3)" class="px-2.5 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg cursor-pointer">3</button>
                        <button type="button" onclick="setModalWeight(4)" class="px-2.5 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg cursor-pointer">4</button>
                    </div>
                </div>
                <p class="text-[11px] text-slate-400 mt-1">
                    Korekta wagi dla sprawdzianów lub kartkówek błędnie oznaczonych przez nauczyciela.
                </p>
            </div>

            <div id="modal-grade-error" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-xl"></div>

            <!-- Stopka akcji -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                <button type="button" id="modal-btn-reset" onclick="resetEditGrade()"
                        class="hidden px-3 py-2 text-xs font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl transition-all cursor-pointer">
                    🔄 Przywróć ze szkoły
                </button>
                <div class="flex items-center gap-2 ml-auto">
                    <button type="button" onclick="closeEditGradeModal()"
                            class="px-3.5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-all cursor-pointer">
                        Anuluj
                    </button>
                    <button type="submit" id="modal-btn-submit"
                            class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm shadow-indigo-100 transition-all cursor-pointer flex items-center gap-1.5">
                        <span id="modal-spinner" class="hidden animate-spin">⏳</span>
                        <span>Zapisz zmiany</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
let currentEditingGrade = null;

function openEditGradeModal(gradeData) {
    currentEditingGrade = gradeData;
    document.getElementById('modal-grade-id').value = gradeData.id;
    document.getElementById('modal-grade-subject').innerText = gradeData.subject || 'Przedmiot';
    document.getElementById('modal-grade-category').innerText = gradeData.category || '-';
    
    let teacherDate = [];
    if (gradeData.date) teacherDate.push(gradeData.date);
    if (gradeData.teacher && gradeData.teacher !== '—') teacherDate.push(gradeData.teacher);
    document.getElementById('modal-grade-teacher-date').innerText = teacherDate.join(' • ') || '-';
    
    // Ustawienie wartości oceny
    const selectEl = document.getElementById('modal-input-grade');
    const customInputEl = document.getElementById('modal-input-grade-custom');
    let found = false;
    for (let opt of selectEl.options) {
        if (opt.value === gradeData.grade) {
            selectEl.value = gradeData.grade;
            found = true;
            break;
        }
    }
    if (!found) {
        customInputEl.value = gradeData.grade || '';
    } else {
        customInputEl.value = '';
    }

    // Ustawienie wagi
    document.getElementById('modal-input-weight').value = gradeData.weight || '1';

    // Obsługa alertu i przycisku resetu jeśli ocena ma is_custom
    const customAlert = document.getElementById('modal-grade-custom-alert');
    const resetBtn = document.getElementById('modal-btn-reset');
    const origInfo = document.getElementById('modal-grade-original-info');
    
    if (gradeData.is_custom) {
        customAlert.classList.remove('hidden');
        resetBtn.classList.remove('hidden');
        origInfo.innerHTML = `Wartości ze szkoły (Librus): ocena <strong>${gradeData.original_grade || '-'}</strong>, waga: <strong>${gradeData.original_weight || '-'}</strong>.`;
    } else {
        customAlert.classList.add('hidden');
        resetBtn.classList.add('hidden');
    }

    document.getElementById('modal-grade-error').classList.add('hidden');
    document.getElementById('edit-grade-modal').classList.remove('hidden');
}

function closeEditGradeModal() {
    document.getElementById('edit-grade-modal').classList.add('hidden');
    currentEditingGrade = null;
}

function handleEditModalBackdropClick(event) {
    if (event.target.id === 'edit-grade-modal') {
        closeEditGradeModal();
    }
}

function setModalWeight(val) {
    document.getElementById('modal-input-weight').value = val;
}

async function submitEditGrade(event) {
    event.preventDefault();
    const errorEl = document.getElementById('modal-grade-error');
    const spinner = document.getElementById('modal-spinner');
    const submitBtn = document.getElementById('modal-btn-submit');

    errorEl.classList.add('hidden');
    spinner.classList.remove('hidden');
    submitBtn.disabled = true;

    const gradeId = document.getElementById('modal-grade-id').value;
    const customGrade = document.getElementById('modal-input-grade-custom').value.trim();
    const selectedGrade = document.getElementById('modal-input-grade').value;
    const finalGrade = customGrade || selectedGrade;
    const weight = document.getElementById('modal-input-weight').value;

    const formData = new FormData();
    formData.append('grade_id', gradeId);
    formData.append('grade', finalGrade);
    formData.append('weight', weight);

    try {
        const resp = await fetch('{{ url_for("web.api_grade_update") }}', {
            method: 'POST',
            body: formData,
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
            // Jeśli jesteśmy w widoku szczegółowym przedmiotu, odświeżamy bieżącą stronę
            if (window.location.pathname.includes('/oceny/') || window.location.pathname.includes('/przedmiot/')) {
                window.location.reload();
            } else {
                window.location.search = '?tab=oceny';
            }
        } else {
            errorEl.innerText = data.message || 'Wystąpił błąd podczas zapisywania oceny.';
            errorEl.classList.remove('hidden');
            spinner.classList.add('hidden');
            submitBtn.disabled = false;
        }
    } catch (err) {
        errorEl.innerText = 'Błąd połączenia z serwerem: ' + err;
        errorEl.classList.remove('hidden');
        spinner.classList.add('hidden');
        submitBtn.disabled = false;
    }
}

async function resetEditGrade() {
    if (!currentEditingGrade) return;
    if (!confirm('Czy na pewno chcesz przywrócić oryginalną ocenę i wagę ze szkoły (z Librusa)?')) return;

    const errorEl = document.getElementById('modal-grade-error');
    errorEl.classList.add('hidden');

    const formData = new FormData();
    formData.append('grade_id', currentEditingGrade.id);

    try {
        const resp = await fetch('{{ url_for("web.api_grade_reset") }}', {
            method: 'POST',
            body: formData,
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
            if (window.location.pathname.includes('/oceny/') || window.location.pathname.includes('/przedmiot/')) {
                window.location.reload();
            } else {
                window.location.search = '?tab=oceny';
            }
        } else {
            errorEl.innerText = data.message || 'Wystąpił błąd podczas resetowania oceny.';
            errorEl.classList.remove('hidden');
        }
    } catch (err) {
        errorEl.innerText = 'Błąd połączenia z serwerem: ' + err;
        errorEl.classList.remove('hidden');
    }
}
</script>
